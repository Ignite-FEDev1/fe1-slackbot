name: Jira delay reminder preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jira-delay-reminder
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run test:jira-delays
      - run: npm run remind:jira-delays
        env:
          ATLASSIAN_TOKEN: ${{ secrets.ATLASSIAN_TOKEN }}
          DRY_RUN: 'true'
