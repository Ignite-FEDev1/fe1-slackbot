name: Jira delay reminder

on:
  schedule:
    # 17:00 Asia/Seoul, Monday-Friday (UTC+9, no daylight saving).
    - cron: '0 8 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview only (do not send to Slack)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: jira-delay-reminder
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run test:jira-delays
      - run: npm run remind:jira-delays
        env:
          ATLASSIAN_TOKEN: ${{ secrets.ATLASSIAN_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          JIRA_DELAY_SLACK_CHANNEL: C04HYKFMXT2
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
